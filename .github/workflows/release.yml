name: Release

on:
  push:
    tags:
      - "v*.*.*"
      - "*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read plugin version
        id: plugin
        run: |
          VERSION="$(python3 .github/scripts/package-plugin.py version)"
          TAG="${GITHUB_REF_NAME#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Plugin version: ${VERSION}"
          echo "Tag version: ${TAG}"
          if [ "${VERSION}" != "${TAG}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match plugin Version ${VERSION} in happybites.php"
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            admin-app/package-lock.json
            pwa/package-lock.json

      - name: Build admin app
        working-directory: admin-app
        run: |
          npm ci
          npm run build

      - name: Build PWA
        working-directory: pwa
        run: |
          npm ci --legacy-peer-deps
          npm run build

      - name: Package plugin zip
        run: |
          python3 .github/scripts/package-plugin.py package \
            --out "dist/happybites-${{ steps.plugin.outputs.version }}.zip"

      - name: Changelog from readme.txt
        run: |
          python3 .github/scripts/package-plugin.py changelog \
            --version "${{ steps.plugin.outputs.version }}" \
            --out release-notes.md
          cat release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: HappyBites ${{ steps.plugin.outputs.version }}
          body_path: release-notes.md
          generate_release_notes: true
          files: dist/happybites-${{ steps.plugin.outputs.version }}.zip
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
